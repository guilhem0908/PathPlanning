[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
# The planning modules of src/core are kept as their authors committed them.
extend-exclude = ["src/core"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["B008", "B905"]
