name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Plan one track without a window
        run: python src/main.py --track small_track --planner midpoint --no-window
      - name: Benchmark smoke run
        run: python scripts/benchmark.py --quick --jobs 2 --out-dir build/bench
